<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VibeWand · 全页面外观审查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#1d2430;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{position:sticky;top:0;background:#fafbfcf5;backdrop-filter:blur(16px);padding:18px 24px;border-bottom:1px solid #dce0e6;z-index:1;display:flex;align-items:center;gap:22px}h1{font-size:19px;margin:0}nav{display:flex;gap:6px}button{font:inherit;padding:7px 13px;border:1px solid #d8dce4;background:white;border-radius:7px;cursor:pointer}button.active{background:#087df4;border-color:#087df4;color:white}main{padding:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}figure{margin:0;min-width:0}figcaption{margin:0 0 8px;font-weight:600}img{width:100%;height:auto;display:block;border:1px solid #d8dce4;border-radius:9px;background:white}a{color:inherit;text-decoration:none}.note{color:#6b7280;font-size:12px;margin-left:auto}@media(max-width:800px){main{grid-template-columns:1fr}header{flex-wrap:wrap}.note{display:none}}
</style><header><h1>VibeWand 0.5.3 · 全页面外观审查</h1><nav><button class="active" data-variant="zh">中文 · 常用窗口</button><button data-variant="en-compact">English · Compact</button><button data-variant="dark-compact">深色 · 紧凑窗口</button></nav><span class="note">点击图片查看原图</span></header><main id="gallery"></main>
<script>
const pages=[['general','通用 / General'],['devices','设备与按键 / Devices & inputs'],['applications','应用适配 / Applications'],['overlay','悬浮面板 / Overlay'],['developer','开发者 / Developer'],['about','关于 / About']];
function show(variant){document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));document.getElementById('gallery').replaceChildren(...pages.map(([id,title])=>{let f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),i=document.createElement('img');c.textContent=title;i.src='images/ui-audit/'+variant+'-'+id+'.png';i.alt=title;a.href=i.src;a.target='_blank';a.append(i);f.append(c,a);return f}));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.variant));show('zh');
</script></html>
