# VibeWand's coordinator as a DeepSeek Harness bundle. The profile VibeWand
# writes into a harness's home names this bundle and nothing else, so this file
# is the complete tree: model providers, credentials, a session store and a
# picture store, the Agent Client Protocol bridge, and no shell, file, web,
# skill or subagent tools. The only tools the model sees are the ones VibeWand
# mounts per session.
#
# The harness VibeWand ships and a harness the user installed both run this
# tree. What differs is the profile's own patch, which VibeWand writes at each
# start: for the shipped harness one row that reads the model the user set up
# in VibeWand; for an installed one the model rows of the user's own profile,
# copied as they stand. Rows carry the ids the harness's base bundle gives
# them, so those rows land here. Sessions go to the home's store, where an
# installed harness's desktop and web apps can open them.
#
# package.json lists the packages these rows name. The shipped harness is
# assembled from that list; an installed one has them already.
#
# Left out on purpose: session-log-deepseek and plugin-package-inventory-deepseek,
# which attach the session log and the plugin list to each model request, and
# the telemetry exporters.
- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    # VibeWand names the model: the one set up or picked there, or the default
    # an installed harness is set to.
    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config: !!js JSON.parse(process.env.VIBEWAND_MODEL ?? "{}")

    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'

    # Signing in with a DeepSeek account, as an installed harness's own apps offer it.
    - id: deepseek-account
      name: '@deepseek-ai/dsh-deepseek-account-platform'
      config:
        desktopPlatform: null

    - id: llm-deepseek-account
      name: '@deepseek-ai/dsh-llm-deepseek-account'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    # A conversation is titled from the opening words of its first command,
    # which VibeWand starts with its own name.
    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 84
        maxTitleBytes: 96

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # A picture a tool shows the model is kept here, outside the session log. VibeWand
    # mounts the one tool that takes pictures only when the user has let the model see.
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    # The cache of session summaries a harness's own apps list sessions from.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.VIBEWAND_SYSTEM_PROMPT ?? "You operate a desktop through the provided tools."

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    # VibeWand's gateway is the one place that asks the user; this tree has
    # nothing of its own to ask about.
    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: never
