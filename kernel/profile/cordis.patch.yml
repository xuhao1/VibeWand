# VibeWand's coordinator kernel: an explicit, complete DeepSeek Harness tree
# with no bundle underneath. It has a model, a session and the Agent Client
# Protocol bridge, and nothing else: no shell, no file, web, skill or subagent
# tools, and no image store. The only tools the model sees are the ones VibeWand
# mounts per session.
#
# The model is whichever endpoint the user chose in VibeWand. The app describes
# it in VIBEWAND_ROUTE at launch and hands the key over in VIBEWAND_MODEL_KEY;
# neither is written to disk here.
#
# Left out on purpose: session-log-deepseek and plugin-package-inventory-deepseek,
# which attach the session log and the plugin list to each model request.
- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        provider: vibewand
        model: !!js process.env.VIBEWAND_MODEL ?? ""

    - id: llm-route
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: !!js JSON.parse(process.env.VIBEWAND_ROUTE ?? "{}")

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.VIBEWAND_SYSTEM_PROMPT ?? "You operate a desktop through the provided tools."

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    # VibeWand's gateway is the one place that asks the user; the kernel has
    # nothing of its own to ask about.
    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: never
